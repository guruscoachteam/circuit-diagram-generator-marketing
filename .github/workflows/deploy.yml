name: Deploy

# Rebuilds and deploys the site whenever content or code lands on main.
# This is what makes Keystatic's admin UI — and the Mission Control agent's
# article tools — actually publish: both write files to this repo, and
# without this workflow the commit lands but the live site never changes.

on:
  push:
    branches: [main]
  workflow_dispatch:

# A burst of commits (publishing several articles) should settle into one
# deploy of the final state rather than racing.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # package.json requires >=22.12.0
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
