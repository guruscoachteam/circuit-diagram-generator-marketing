<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-labelledby="t3 d3">
  <title id="t3">Series versus parallel connections</title>
  <desc id="d3">In series one current path runs through R1 and R2. In parallel R1 and R2 each get their own path across the same two nodes.</desc>
  <rect width="720" height="280" fill="#ffffff"/>

  <!-- Series -->
  <g transform="translate(40,30)">
    <text x="140" y="0" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#050504">Series</text>
    <line x1="20" y1="90" x2="60" y2="90" stroke="#050504" stroke-width="2"/>
    <rect x="60" y="78" width="70" height="24" fill="none" stroke="#050504" stroke-width="2"/>
    <text x="95" y="70" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#0f766e">R1</text>
    <line x1="130" y1="90" x2="160" y2="90" stroke="#050504" stroke-width="2"/>
    <rect x="160" y="78" width="70" height="24" fill="none" stroke="#050504" stroke-width="2"/>
    <text x="195" y="70" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#0f766e">R2</text>
    <line x1="230" y1="90" x2="270" y2="90" stroke="#050504" stroke-width="2"/>
    <path d="M40,120 C80,150 200,150 240,120" fill="none" stroke="#0f766e" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
        <path d="M0,0 L6,3 L0,6 Z" fill="#0f766e"/>
      </marker>
    </defs>
    <text x="140" y="175" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#2a2e2d">One current path through both</text>
    <text x="140" y="196" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#555c5a">Same current, voltage divides</text>
  </g>

  <!-- Parallel -->
  <g transform="translate(380,30)">
    <text x="140" y="0" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#050504">Parallel</text>
    <line x1="40" y1="50" x2="40" y2="130" stroke="#050504" stroke-width="2"/>
    <line x1="240" y1="50" x2="240" y2="130" stroke="#050504" stroke-width="2"/>
    <circle cx="40" cy="50" r="5" fill="#0f766e"/>
    <circle cx="240" cy="50" r="5" fill="#0f766e"/>
    <circle cx="40" cy="130" r="5" fill="#0f766e"/>
    <circle cx="240" cy="130" r="5" fill="#0f766e"/>
    <line x1="40" y1="50" x2="85" y2="50" stroke="#050504" stroke-width="2"/>
    <rect x="85" y="38" width="70" height="24" fill="none" stroke="#050504" stroke-width="2"/>
    <text x="120" y="30" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#0f766e">R1</text>
    <line x1="155" y1="50" x2="240" y2="50" stroke="#050504" stroke-width="2"/>
    <line x1="40" y1="130" x2="85" y2="130" stroke="#050504" stroke-width="2"/>
    <rect x="85" y="118" width="70" height="24" fill="none" stroke="#050504" stroke-width="2"/>
    <text x="120" y="160" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#0f766e">R2</text>
    <line x1="155" y1="130" x2="240" y2="130" stroke="#050504" stroke-width="2"/>
    <line x1="20" y1="90" x2="40" y2="90" stroke="#050504" stroke-width="2"/>
    <line x1="240" y1="90" x2="260" y2="90" stroke="#050504" stroke-width="2"/>
    <text x="140" y="196" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#2a2e2d">Two paths across the same nodes</text>
    <text x="140" y="217" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#555c5a">Same voltage, current divides</text>
  </g>
</svg>
