<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img" aria-labelledby="t2 d2">
  <title id="t2">Wire junctions versus crossings</title>
  <desc id="d2">A solid dot means wires are joined into one node. No dot means the wires cross without touching.</desc>
  <rect width="720" height="240" fill="#fbfaf7"/>

  <g transform="translate(80,40)">
    <text x="110" y="0" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#141310">Connected (junction)</text>
    <line x1="0" y1="80" x2="220" y2="80" stroke="#141310" stroke-width="2.5"/>
    <line x1="110" y1="20" x2="110" y2="140" stroke="#141310" stroke-width="2.5"/>
    <circle cx="110" cy="80" r="7" fill="#8a570f"/>
    <text x="110" y="170" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#8a570f">Solid dot = one node</text>
  </g>

  <g transform="translate(420,40)">
    <text x="110" y="0" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#141310">Not connected</text>
    <line x1="0" y1="80" x2="220" y2="80" stroke="#141310" stroke-width="2.5"/>
    <line x1="110" y1="20" x2="110" y2="62" stroke="#141310" stroke-width="2.5"/>
    <path d="M98,80 A12,12 0 0 1 122,80" fill="none" stroke="#141310" stroke-width="2.5"/>
    <line x1="110" y1="98" x2="110" y2="140" stroke="#141310" stroke-width="2.5"/>
    <text x="110" y="170" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#6b6559">No dot (or hop) = no join</text>
  </g>
</svg>
