<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300"><title>LED current-limiting resistor circuit</title><desc>A series loop with a 9V battery BT1, a resistor R1, and an LED D1, connected by wires forming a single rectangular loop.</desc><rect width="480" height="300" fill="#fbfaf7"/><g stroke="#141310" stroke-width="2" fill="none"><path d="M80 60 L80 240"/><path d="M80 240 L400 240"/><path d="M400 240 L400 190"/><path d="M400 110 L400 60"/><path d="M80 60 L200 60"/><path d="M280 60 L400 60"/></g><g stroke="#141310" stroke-width="2.5" fill="none"><line x1="65" y1="95" x2="95" y2="95"/><line x1="70" y1="80" x2="90" y2="80"/><line x1="65" y1="135" x2="95" y2="135"/><line x1="70" y1="150" x2="90" y2="150"/></g><text x="110" y="92" font-family="Georgia, serif" font-size="14" fill="#141310">+</text><text x="110" y="152" font-family="Georgia, serif" font-size="14" fill="#141310">−</text><text x="30" y="120" font-family="Georgia, serif" font-size="16" fill="#141310">BT1</text><text x="22" y="140" font-family="Georgia, serif" font-size="13" fill="#8a570f">9V</text><g stroke="#141310" stroke-width="2" fill="none"><path d="M200 60 L206 48 L214 72 L222 48 L230 72 L238 48 L246 72 L254 48 L262 72 L270 48 L280 60"/></g><text x="212" y="32" font-family="Georgia, serif" font-size="16" fill="#141310">R1</text><text x="200" y="20" font-family="Georgia, serif" font-size="13" fill="#8a570f">470Ω</text><g stroke="#141310" stroke-width="2" fill="none"><polygon points="400,110 380,150 420,150" fill="#fbfaf7"/><line x1="380" y1="150" x2="420" y2="150"/></g><g stroke="#8a570f" stroke-width="1.5" fill="none"><path d="M410 105 L424 92"/><path d="M418 111 L432 98"/><path d="M420 92 L424 92 L424 96"/><path d="M428 98 L432 98 L432 102"/></g><text x="430" y="130" font-family="Georgia, serif" font-size="16" fill="#141310">D1</text><text x="418" y="170" font-family="Georgia, serif" font-size="13" fill="#8a570f">LED</text></svg>